<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc">
  <title id="title">Playlog Brand Identity</title>
  <desc id="desc">Playlog identity board with logo, tagline, positioning, and five product pillars.</desc>
  <defs>
    <linearGradient id="glow" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#22C55E"/><stop offset=".5" stop-color="#06B6D4"/><stop offset="1" stop-color="#8B5CF6"/></linearGradient>
    <radialGradient id="halo"><stop stop-color="#22C55E" stop-opacity=".18"/><stop offset="1" stop-color="#22C55E" stop-opacity="0"/></radialGradient>
    <style>
      .font{font-family:Sora,"Segoe UI",sans-serif}.muted{fill:#97A1AC}.label{fill:#22C55E;font-size:18px;font-weight:700;letter-spacing:4px}.card{fill:#1A1F24;stroke:#2A323B;stroke-width:2}.line{stroke:#22C55E;stroke-width:3;fill:none;stroke-linecap:round;stroke-linejoin:round}
    </style>
  </defs>
  <rect width="1600" height="1000" fill="#0F1115"/>
  <circle cx="1160" cy="150" r="420" fill="url(#halo)"/>
  <rect x="0" y="0" width="12" height="1000" fill="url(#glow)"/>
  <g class="font">
    <text x="76" y="82" class="label">PLAYLOG</text><text x="76" y="114" fill="#97A1AC" font-size="16" letter-spacing="3">BRAND IDENTITY</text>
    <image x="105" y="190" width="230" height="255" href="data:image/svg+xml;base64," xlink:href="data:image/svg+xml;base64,"/>
    <text x="390" y="340" fill="#F5F6F7" font-size="112" font-weight="750" letter-spacing="-6">Playlog</text>
    <text x="400" y="410" fill="#22C55E" font-size="25" font-weight="650" letter-spacing="8">TRACK. RATE. REMEMBER.</text>
    <text x="400" y="485" fill="#F5F6F7" font-size="25">Your personal game journal.</text>
    <text x="400" y="530" class="muted" font-size="21">Track what you play, rate the experience,</text>
    <text x="400" y="563" class="muted" font-size="21">and build a library of memories over time.</text>
    <g transform="translate(70 660)">
      <g><rect class="card" width="270" height="235" rx="24"/><path class="line" d="M116 48h38v55l-19-12-19 12Z"/><text x="135" y="145" fill="#F5F6F7" text-anchor="middle" font-size="23" font-weight="700">LOG</text><text x="135" y="181" class="muted" text-anchor="middle" font-size="16">Keep a history of</text><text x="135" y="205" class="muted" text-anchor="middle" font-size="16">every game.</text></g>
      <g transform="translate(300)"><rect class="card" width="270" height="235" rx="24"/><path class="line" d="m135 45 10 22 24 3-18 17 5 24-21-12-21 12 5-24-18-17 24-3Z"/><text x="135" y="145" fill="#F5F6F7" text-anchor="middle" font-size="23" font-weight="700">RATE</text><text x="135" y="181" class="muted" text-anchor="middle" font-size="16">Capture how the</text><text x="135" y="205" class="muted" text-anchor="middle" font-size="16">experience felt.</text></g>
      <g transform="translate(600)"><rect class="card" width="270" height="235" rx="24"/><circle class="line" cx="135" cy="75" r="30"/><path class="line" d="m146 64-8 19-19 8 8-19Z"/><text x="135" y="145" fill="#F5F6F7" text-anchor="middle" font-size="23" font-weight="700">DISCOVER</text><text x="135" y="181" class="muted" text-anchor="middle" font-size="16">Find the next game</text><text x="135" y="205" class="muted" text-anchor="middle" font-size="16">worth remembering.</text></g>
      <g transform="translate(900)"><rect class="card" width="270" height="235" rx="24"/><path class="line" d="M106 103V72m20 31V50m20 53V63m20 40V40M98 110h76"/><text x="135" y="145" fill="#F5F6F7" text-anchor="middle" font-size="23" font-weight="700">REFLECT</text><text x="135" y="181" class="muted" text-anchor="middle" font-size="16">See your journey,</text><text x="135" y="205" class="muted" text-anchor="middle" font-size="16">not just totals.</text></g>
      <g transform="translate(1200)"><rect class="card" width="270" height="235" rx="24"/><circle class="line" cx="124" cy="66" r="14"/><circle class="line" cx="151" cy="70" r="12"/><path class="line" d="M96 108c4-20 16-29 30-29s25 9 29 29m-8 0c3-14 12-21 23-21 12 0 20 7 23 21"/><text x="135" y="145" fill="#F5F6F7" text-anchor="middle" font-size="23" font-weight="700">SHARE</text><text x="135" y="181" class="muted" text-anchor="middle" font-size="16">Connect on your</text><text x="135" y="205" class="muted" text-anchor="middle" font-size="16">own terms.</text></g>
    </g>
    <text x="1530" y="960" class="muted" font-size="15" text-anchor="end">PLAYLOG BRAND REFERENCE · IDENTITY</text>
  </g>
</svg>
