<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc">
  <title id="title">Playlog Brand in Use — Mobile App Concept</title><desc id="desc">Three conceptual Playlog mobile screens, explicitly not implemented in the web repository.</desc>
  <defs><linearGradient id="cover1" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#8B5CF6"/><stop offset="1" stop-color="#1A1F24"/></linearGradient><linearGradient id="cover2"><stop stop-color="#22C55E"/><stop offset="1" stop-color="#0F1115"/></linearGradient><style>.font{font-family:Sora,"Segoe UI",sans-serif}.muted{fill:#97A1AC}.line{stroke:#2A323B;stroke-width:2}.green{fill:#22C55E}</style></defs><rect width="1600" height="1000" fill="#0F1115"/>
  <g class="font"><text x="70" y="76" fill="#22C55E" font-size="17" font-weight="700" letter-spacing="3">BRAND IN USE · MOBILE APP</text><text x="70" y="132" fill="#F5F6F7" font-size="44" font-weight="750">The same journal, shaped for your hand.</text><rect x="70" y="160" width="700" height="45" rx="22" fill="#2B2010" stroke="#EAB308"/><text x="95" y="190" fill="#F5C94C" font-size="16" font-weight="650">CONCEPT REFERENCE · NOT IMPLEMENTED IN THIS REPOSITORY</text>
    <g transform="translate(160 250)"><rect width="350" height="680" rx="54" fill="#090B0E" stroke="#3A444F" stroke-width="4"/><rect x="18" y="18" width="314" height="644" rx="40" fill="#0F1115"/><rect x="122" y="30" width="105" height="23" rx="12" fill="#050607"/><text x="42" y="90" fill="#F5F6F7" font-size="27" font-weight="700">My Library</text><text x="42" y="125" class="green" font-size="14">Played 128</text><text x="143" y="125" class="muted" font-size="14">Backlog 29</text><g transform="translate(38 160)"><rect width="72" height="98" rx="12" fill="url(#cover1)"/><text x="92" y="31" fill="#F5F6F7" font-size="16" font-weight="650">Aster Vale</text><text x="92" y="58" class="muted" font-size="13">47 hours</text><text x="92" y="83" fill="#EAB308" font-size="15">★★★★☆</text><line x1="0" y1="120" x2="274" y2="120" class="line"/></g><g transform="translate(38 300)"><rect width="72" height="98" rx="12" fill="url(#cover2)"/><text x="92" y="31" fill="#F5F6F7" font-size="16" font-weight="650">Quiet Orbit</text><text x="92" y="58" class="muted" font-size="13">18 hours</text><text x="92" y="83" fill="#EAB308" font-size="15">★★★★★</text><line x1="0" y1="120" x2="274" y2="120" class="line"/></g><g transform="translate(38 545)"><text class="green" font-size="12">LIBRARY</text><text x="90" class="muted" font-size="12">DISCOVER</text><text x="190" class="muted" font-size="12">ACTIVITY</text><text x="274" class="muted" font-size="12">PROFILE</text></g></g>
    <g transform="translate(625 250)"><rect width="350" height="680" rx="54" fill="#090B0E" stroke="#3A444F" stroke-width="4"/><rect x="18" y="18" width="314" height="644" rx="40" fill="#0F1115"/><rect x="122" y="30" width="105" height="23" rx="12" fill="#050607"/><rect x="34" y="74" width="282" height="225" rx="26" fill="url(#cover1)"/><text x="42" y="350" fill="#F5F6F7" font-size="28" font-weight="750">Aster Vale</text><text x="42" y="380" class="muted" font-size="14">Personal entry · Played</text><text x="42" y="435" class="muted" font-size="13">PLAYTIME</text><text x="42" y="470" fill="#F5F6F7" font-size="28" font-weight="700">47h</text><text x="180" y="435" class="muted" font-size="13">YOUR RATING</text><text x="180" y="470" fill="#EAB308" font-size="28" font-weight="700">4.5 ★</text><text x="42" y="530" fill="#F5F6F7" font-size="16" font-weight="650">Your memory</text><text x="42" y="565" class="muted" font-size="14">A patient world filled with</text><text x="42" y="588" class="muted" font-size="14">quiet mystery and wonder.</text><rect x="42" y="620" width="266" height="10" rx="5" fill="#1A1F24"/><rect x="42" y="620" width="198" height="10" rx="5" fill="#22C55E"/></g>
    <g transform="translate(1090 250)"><rect width="350" height="680" rx="54" fill="#090B0E" stroke="#3A444F" stroke-width="4"/><rect x="18" y="18" width="314" height="644" rx="40" fill="#0F1115"/><rect x="122" y="30" width="105" height="23" rx="12" fill="#050607"/><text x="42" y="96" fill="#F5F6F7" font-size="27" font-weight="700">Your Journey</text><text x="42" y="130" class="muted" font-size="14">A history worth remembering.</text><g transform="translate(42 175)"><rect width="122" height="100" rx="18" fill="#1A1F24"/><text x="18" y="30" class="muted" font-size="12">GAMES</text><text x="18" y="70" fill="#F5F6F7" font-size="30" font-weight="700">128</text><rect x="140" width="122" height="100" rx="18" fill="#1A1F24"/><text x="158" y="30" class="muted" font-size="12">MEMORIES</text><text x="158" y="70" fill="#F5F6F7" font-size="30" font-weight="700">84</text></g><text x="42" y="340" fill="#F5F6F7" font-size="16" font-weight="650">Hours over time</text><polyline points="42,470 75,455 108,462 141,425 174,438 207,390 240,407 275,355 308,370" fill="none" stroke="#22C55E" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><line x1="42" y1="490" x2="308" y2="490" class="line"/><text x="42" y="555" fill="#F5F6F7" font-size="16" font-weight="650">Meaning over metrics</text><text x="42" y="590" class="muted" font-size="14">Stats support reflection.</text><text x="42" y="613" class="muted" font-size="14">They never define the player.</text></g>
    <text x="1530" y="970" class="muted" font-size="15" text-anchor="end">CROSS-PLATFORM VISUAL DIRECTION ONLY</text>
  </g>
</svg>
