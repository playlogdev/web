<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc">
  <title id="title">Playlog Brand Tone</title><desc id="desc">Four Playlog voice principles with practical writing examples.</desc>
  <defs><style>.font{font-family:Sora,"Segoe UI",sans-serif}.muted{fill:#97A1AC}.card{fill:#1A1F24;stroke:#2A323B;stroke-width:2}.green{fill:#22C55E}.good{fill:#DDFBE7}.bad{fill:#FECACA}</style></defs><rect width="1600" height="1000" fill="#0F1115"/><g class="font"><text x="70" y="80" class="green" font-size="17" font-weight="700" letter-spacing="3">BRAND TONE</text><text x="70" y="140" fill="#F5F6F7" font-size="46" font-weight="750">Thoughtful about games. Clear with players.</text><text x="70" y="180" class="muted" font-size="18">The voice supports reflection without performing “gamer” personality.</text>
    <g transform="translate(70 235)"><rect class="card" width="710" height="290" rx="28"/><circle cx="70" cy="70" r="30" fill="#172E21" stroke="#22C55E"/><path d="m55 70 10 10 22-24" fill="none" stroke="#22C55E" stroke-width="4" stroke-linecap="round"/><text x="125" y="63" fill="#F5F6F7" font-size="29" font-weight="700">Premium</text><text x="125" y="96" class="muted" font-size="17">Thoughtful and polished, never ornate.</text><text x="45" y="155" class="green" font-size="14" font-weight="700">DO</text><text x="92" y="155" class="good" font-size="16">“Your library is ready when you are.”</text><text x="45" y="207" fill="#EF4444" font-size="14" font-weight="700">AVOID</text><text x="112" y="207" class="bad" font-size="16">“Unlock the ultimate elite experience!”</text></g>
    <g transform="translate(820 235)"><rect class="card" width="710" height="290" rx="28"/><circle cx="70" cy="70" r="30" fill="#172E21" stroke="#22C55E"/><path d="M54 62h32M54 70h23M54 78h28" stroke="#22C55E" stroke-width="4" stroke-linecap="round"/><text x="125" y="63" fill="#F5F6F7" font-size="29" font-weight="700">Minimal</text><text x="125" y="96" class="muted" font-size="17">Direct and focused, never vague.</text><text x="45" y="155" class="green" font-size="14" font-weight="700">DO</text><text x="92" y="155" class="good" font-size="16">“Add a note about this game.”</text><text x="45" y="207" fill="#EF4444" font-size="14" font-weight="700">AVOID</text><text x="112" y="207" class="bad" font-size="16">“Continue to the next step of your journey.”</text></g>
    <g transform="translate(70 565)"><rect class="card" width="710" height="290" rx="28"/><circle cx="70" cy="70" r="30" fill="#172E21" stroke="#22C55E"/><path d="M70 49 86 56v13c0 14-7 24-16 29-9-5-16-15-16-29V56Z" fill="none" stroke="#22C55E" stroke-width="3"/><text x="125" y="63" fill="#F5F6F7" font-size="29" font-weight="700">Trustworthy</text><text x="125" y="96" class="muted" font-size="17">Precise about data, privacy, and state.</text><text x="45" y="155" class="green" font-size="14" font-weight="700">DO</text><text x="92" y="155" class="good" font-size="16">“Last synced 4 minutes ago.”</text><text x="45" y="207" fill="#EF4444" font-size="14" font-weight="700">AVOID</text><text x="112" y="207" class="bad" font-size="16">“Everything looks good!” when status is unknown.</text></g>
    <g transform="translate(820 565)"><rect class="card" width="710" height="290" rx="28"/><circle cx="70" cy="70" r="30" fill="#172E21" stroke="#22C55E"/><path d="M70 96S48 82 48 64c0-10 13-16 22-5 9-11 22-5 22 5 0 18-22 32-22 32Z" fill="none" stroke="#22C55E" stroke-width="3"/><text x="125" y="63" fill="#F5F6F7" font-size="29" font-weight="700">Passionate</text><text x="125" y="96" class="muted" font-size="17">Warm about games, never forced slang.</text><text x="45" y="155" class="green" font-size="14" font-weight="700">DO</text><text x="92" y="155" class="good" font-size="16">“Remember what made it special.”</text><text x="45" y="207" fill="#EF4444" font-size="14" font-weight="700">AVOID</text><text x="112" y="207" class="bad" font-size="16">“GG, gamer! Time to grind your backlog.”</text></g>
    <text x="70" y="935" class="muted" font-size="17">Sentence case · Specific verbs · Honest system states · No engagement pressure</text></g>
</svg>
