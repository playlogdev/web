<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc">
  <title id="title">Playlog Brand Values</title><desc id="desc">Four product values: Player First, Meaningful Tracking, Community, and Quality.</desc>
  <defs><linearGradient id="g" x1="0" x2="1"><stop stop-color="#22C55E"/><stop offset=".34" stop-color="#06B6D4"/><stop offset=".67" stop-color="#3B82F6"/><stop offset="1" stop-color="#8B5CF6"/></linearGradient><style>.font{font-family:Sora,"Segoe UI",sans-serif}.muted{fill:#97A1AC}.card{fill:#1A1F24;stroke:#2A323B;stroke-width:2}.green{fill:#22C55E}</style></defs><rect width="1600" height="1000" fill="#0F1115"/><rect x="0" y="0" width="1600" height="10" fill="url(#g)"/><g class="font"><text x="70" y="85" class="green" font-size="17" font-weight="700" letter-spacing="3">BRAND VALUES</text><text x="70" y="148" fill="#F5F6F7" font-size="47" font-weight="750">The promises behind the interface.</text><text x="70" y="188" class="muted" font-size="18">Values become product behavior only when they shape real decisions.</text>
    <g transform="translate(70 260)"><rect class="card" width="710" height="270" rx="30"/><text x="42" y="60" class="green" font-size="17" font-weight="700">01</text><text x="95" y="65" fill="#F5F6F7" font-size="31" font-weight="700">Player First</text><text x="42" y="118" class="muted" font-size="18">The journal belongs to the player.</text><path d="M44 165h20l10 12 22-27" fill="none" stroke="#22C55E" stroke-width="4" stroke-linecap="round"/><text x="115" y="170" fill="#F5F6F7" font-size="16">User control over engagement tricks</text><path d="M44 214h20l10 12 22-27" fill="none" stroke="#22C55E" stroke-width="4" stroke-linecap="round"/><text x="115" y="219" fill="#F5F6F7" font-size="16">Privacy and intent are explicit</text></g>
    <g transform="translate(820 260)"><rect class="card" width="710" height="270" rx="30"/><text x="42" y="60" class="green" font-size="17" font-weight="700">02</text><text x="95" y="65" fill="#F5F6F7" font-size="31" font-weight="700">Meaningful Tracking</text><text x="42" y="118" class="muted" font-size="18">Memories and context outrank vanity totals.</text><path d="M44 165h20l10 12 22-27" fill="none" stroke="#22C55E" stroke-width="4" stroke-linecap="round"/><text x="115" y="170" fill="#F5F6F7" font-size="16">Statuses never inferred without consent</text><path d="M44 214h20l10 12 22-27" fill="none" stroke="#22C55E" stroke-width="4" stroke-linecap="round"/><text x="115" y="219" fill="#F5F6F7" font-size="16">Reflection before gamification</text></g>
    <g transform="translate(70 570)"><rect class="card" width="710" height="270" rx="30"/><text x="42" y="60" class="green" font-size="17" font-weight="700">03</text><text x="95" y="65" fill="#F5F6F7" font-size="31" font-weight="700">Community</text><text x="42" y="118" class="muted" font-size="18">Sharing is optional, respectful, and human.</text><path d="M44 165h20l10 12 22-27" fill="none" stroke="#22C55E" stroke-width="4" stroke-linecap="round"/><text x="115" y="170" fill="#F5F6F7" font-size="16">Connection without social pressure</text><path d="M44 214h20l10 12 22-27" fill="none" stroke="#22C55E" stroke-width="4" stroke-linecap="round"/><text x="115" y="219" fill="#F5F6F7" font-size="16">Stories over competitive metrics</text></g>
    <g transform="translate(820 570)"><rect class="card" width="710" height="270" rx="30"/><text x="42" y="60" class="green" font-size="17" font-weight="700">04</text><text x="95" y="65" fill="#F5F6F7" font-size="31" font-weight="700">Quality</text><text x="42" y="118" class="muted" font-size="18">Clarity, access, and reliability are the finish.</text><path d="M44 165h20l10 12 22-27" fill="none" stroke="#22C55E" stroke-width="4" stroke-linecap="round"/><text x="115" y="170" fill="#F5F6F7" font-size="16">Accessible by default</text><path d="M44 214h20l10 12 22-27" fill="none" stroke="#22C55E" stroke-width="4" stroke-linecap="round"/><text x="115" y="219" fill="#F5F6F7" font-size="16">Honest failure states and solid performance</text></g>
    <text x="70" y="920" fill="#F5F6F7" font-size="23" font-weight="650">Built by people who love games, for people who want to remember them.</text></g>
</svg>
